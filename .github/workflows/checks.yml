on:
  pull_request:
jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo bench --no-run
      - run: cargo bench --all-features --no-run
  callgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: sudo apt-get update -y
      - run: sudo apt-get install -y valgrind
      - run:
      - run: cargo install iai-callgrind-runner --version "$version"
        env:
          version: cargo metadata --format-version=1 | jq -r '.packages[] | select(.name == "iai-callgrind").version'
      - run: cargo bench --bench callgrind --profile callgrind --all-features
  practices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v4
      - run: cargo fmt --all --check
      - run: cargo clippy
      - run: cargo doc --all-features
      - run: |
          git ls-files '*.md' -z | xargs -0 docker run --rm -v "$PWD:/work" \
          -w /work ghcr.io/igorshubovych/markdownlint-cli:v0.41.0
      - run: |
          git ls-files '*.yaml' '*.yml' | xargs docker run --rm -v "$PWD:/work" \
          -w /work cytopia/yamllint
      - run: |
          git ls-files '*.toml' -z | xargs -0 docker run --rm -v "$PWD:/work" \
          -w /work tamasfe/taplo:0.10.0 fmt --check
      - run: just fmt --check
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo package
      - run: cargo package --all-features
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test
      - run: cargo miri test --all-features
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo test
      - run: cargo test --all-features
  nostd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          target: thumbv7m-none-eabi
      - run: cargo build
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100
      - run: cargo build
